name: Update data

on:
  schedule:
    # 08:05 JST = 23:05 UTC
    - cron: '5 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch drawdown data (data.json)
        run: python3 scripts/fetch_data.py data.json

      - name: Fetch funds data (funds.json)
        run: python3 scripts/fetch_funds.py funds.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json funds.json
          if git diff --cached --quiet; then
            echo "No changes; nothing to commit."
          else
            git commit -m "データ更新（自動）"
            git push
          fi
